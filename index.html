<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate WebOS</title>
<style>
  /* 系統全域變數 */
  :root {
    --win-blue: #0078D7;
    --taskbar-bg: rgba(20, 20, 20, 0.85);
    --window-bg: rgba(255, 255, 255, 0.95);
    --text-dark: #222;
  }
  body, html {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: '-apple-system', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    user-select: none; background: #000;
  }

  /* 桌面背景 */
  #desktop {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: url('https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0?ixlib=rb-4.0.3&auto=format&fit=crop&w=2500&q=80') center/cover no-repeat;
  }

  /* 桌面圖示 */
  .desktop-icons { 
    padding: 15px; display: grid; grid-template-rows: repeat(6, 100px); 
    grid-auto-columns: 85px; grid-auto-flow: column; gap: 10px; 
  }
  .icon {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 85px; height: 95px; color: white; text-shadow: 0px 1px 3px rgba(0,0,0,0.8);
    cursor: pointer; border-radius: 8px; border: 1px solid transparent; text-align: center;
    font-size: 13px; font-weight: 500; transition: 0.2s;
  }
  .icon:hover { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); }
  .icon img { width: 48px; height: 48px; margin-bottom: 8px; filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.4)); }

  /* 工作列 (Windows Style) */
  #taskbar {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 45px;
    background: var(--taskbar-bg); backdrop-filter: blur(20px);
    display: flex; align-items: center; z-index: 9000; border-top: 1px solid rgba(255,255,255,0.1);
  }
  .start-btn {
    width: 50px; height: 45px; display: flex; justify-content: center; align-items: center; 
    cursor: pointer; transition: 0.2s;
  }
  .start-btn img { width: 22px; height: 22px; }
  .start-btn:hover { background: rgba(255,255,255,0.1); }
  .search-bar { 
    width: 250px; height: 32px; background: rgba(255,255,255,0.9); border-radius: 16px; 
    padding: 0 15px; margin-left: 10px; display: flex; align-items: center; color: #555; font-size: 13px;
  }
  .taskbar-apps { display: flex; flex: 1; height: 100%; margin-left: 10px; }
  .taskbar-icon { 
    width: 48px; height: 45px; display: flex; justify-content: center; align-items: center; 
    cursor: pointer; border-bottom: 3px solid transparent; transition: 0.2s;
  }
  .taskbar-icon img { width: 24px; height: 24px; }
  .taskbar-icon:hover { background: rgba(255,255,255,0.1); }
  .taskbar-icon.active { border-bottom: 3px solid #50E3C2; background: rgba(255,255,255,0.05); }
  .system-tray { display: flex; align-items: center; color: white; padding: 0 15px; font-size: 13px; }
  .time-date { text-align: right; line-height: 1.3; margin-left: 15px; }

  /* 開始功能表 */
  #start-menu {
    display: none; position: absolute; bottom: 55px; left: 10px; width: 380px; height: 500px;
    background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(25px); color: white;
    z-index: 8999; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5); overflow: hidden; flex-direction: column;
  }
  .start-header { padding: 20px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .start-header img { width: 40px; height: 40px; border-radius: 50%; margin-right: 15px; }
  .start-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 20px; overflow-y: auto; }
  .start-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; padding: 10px; border-radius: 8px; }
  .start-item:hover { background: rgba(255,255,255,0.1); }
  .start-item img { width: 36px; height: 36px; margin-bottom: 8px; }

  /* 視窗樣式 (融合 macOS 按鈕) */
  .window {
    position: absolute; top: 10%; left: 15%; width: 700px; height: 450px;
    background: var(--window-bg); backdrop-filter: blur(15px); border-radius: 12px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.4); display: none; flex-direction: column;
    z-index: 100; border: 1px solid rgba(200,200,200,0.5); overflow: hidden;
  }
  .title-bar {
    height: 38px; display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(to bottom, #f9f9f9, #e6e6e6); cursor: default;
    border-bottom: 1px solid #ccc;
  }
  
  /* macOS 紅黃綠按鈕 */
  .mac-controls { display: flex; gap: 8px; margin-left: 12px; width: 60px; }
  .mac-btn { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 8px; color: rgba(0,0,0,0.5); opacity: 0.9; }
  .mac-btn:hover { opacity: 1; color: rgba(0,0,0,0.8); }
  .mac-close { background: #ff5f56; border: 1px solid #e0443e; }
  .mac-min { background: #ffbd2e; border: 1px solid #dea123; }
  .mac-max { background: #27c93f; border: 1px solid #1aab29; }
  
  .title-text { flex: 1; text-align: center; font-size: 13px; font-weight: 600; color: #333; margin-right: 72px; /* 平衡標題置中 */ }
  .window-content { flex: 1; position: relative; display: flex; flex-direction: column; background: #fff; }
  
  /* App 特殊樣式 */
  iframe.browser { width: 100%; height: 100%; border: none; }
  .browser-bar { padding: 8px; background: #f1f1f1; display: flex; gap: 10px; border-bottom: 1px solid #ddd; }
  .browser-bar input { flex: 1; padding: 6px 15px; border-radius: 15px; border: 1px solid #ccc; outline: none; }
  
  .settings-container { padding: 20px; color: var(--text-dark); }
  .settings-card { background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 15px; }
  .lang-btn { padding: 8px 15px; border-radius: 6px; border: 1px solid #0078D7; background: white; color: #0078D7; cursor: pointer; margin-right: 10px; }
  .lang-btn:hover { background: #0078D7; color: white; }

  .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px; overflow-y: auto; }
  .photo-grid img { width: 100%; height: 130px; object-fit: cover; border-radius: 8px; cursor: pointer; }
  .photo-grid img:hover { opacity: 0.8; }
</style>
</head>
<body>

<!-- 桌面 -->
<div id="desktop">
  <div class="desktop-icons" id="desktop-icons">
    <!-- 圖示將透過 JS 動態生成，方便切換語言 -->
  </div>

  <!-- 開始功能表 -->
  <div id="start-menu">
    <div class="start-header">
      <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="User">
      <div>
        <div style="font-weight: bold; font-size: 16px;">Admin</div>
        <div style="font-size: 12px; color: #aaa;" data-i18n="local_account">Local Account</div>
      </div>
    </div>
    <div class="start-grid" id="start-grid">
      <!-- Start Menu 項目將透過 JS 生成 -->
    </div>
  </div>

  <!-- 視窗: 瀏覽器 (Browser) -->
  <div class="window" id="app-browser">
    <div class="title-bar" onmousedown="dragStart(event, 'app-browser')">
      <div class="mac-controls">
        <div class="mac-btn mac-close" onclick="closeApp('app-browser')">✕</div>
        <div class="mac-btn mac-min" onclick="closeApp('app-browser')">−</div>
        <div class="mac-btn mac-max" onclick="maximizeApp('app-browser')">⤢</div>
      </div>
      <div class="title-text" data-i18n="browser">Browser</div>
    </div>
    <div class="window-content">
      <div class="browser-bar">
        <button style="border:none; background:transparent; cursor:pointer;">⟵</button>
        <button style="border:none; background:transparent; cursor:pointer;">⟶</button>
        <button style="border:none; background:transparent; cursor:pointer;">↻</button>
        <input type="text" id="url-input" value="https://duckduckgo.com" onkeydown="if(event.key==='Enter') navigateBrowser()">
        <button onclick="navigateBrowser()" style="border:none; background:#0078D7; color:white; border-radius:15px; padding:0 15px; cursor:pointer;">Go</button>
      </div>
      <iframe class="browser" id="browser-frame" src="https://duckduckgo.com"></iframe>
    </div>
  </div>

  <!-- 視窗: 系統設定 (Settings) -->
  <div class="window" id="app-settings" style="width: 500px; height: 400px;">
    <div class="title-bar" onmousedown="dragStart(event, 'app-settings')">
      <div class="mac-controls">
        <div class="mac-btn mac-close" onclick="closeApp('app-settings')">✕</div>
        <div class="mac-btn mac-min" onclick="closeApp('app-settings')">−</div>
        <div class="mac-btn mac-max" onclick="maximizeApp('app-settings')">⤢</div>
      </div>
      <div class="title-text" data-i18n="settings">Settings</div>
    </div>
    <div class="window-content settings-container">
      <h2 data-i18n="settings_title">System Settings</h2>
      <div class="settings-card">
        <h4 style="margin-top:0;" data-i18n="language">Language / 語言</h4>
        <button class="lang-btn" onclick="setLanguage('en')">English</button>
        <button class="lang-btn" onclick="setLanguage('zh')">繁體中文</button>
      </div>
      <div class="settings-card">
        <h4 style="margin-top:0;" data-i18n="system_info">System Information</h4>
        <p>OS: WebOS Ultimate (v2.0)</p>
        <p>Kernel: Browser Sandbox Environment</p>
      </div>
    </div>
  </div>

  <!-- 視窗: 記事本 (Notepad) -->
  <div class="window" id="app-notepad" style="width: 600px; height: 400px;">
    <div class="title-bar" onmousedown="dragStart(event, 'app-notepad')">
      <div class="mac-controls">
        <div class="mac-btn mac-close" onclick="closeApp('app-notepad')">✕</div>
        <div class="mac-btn mac-min" onclick="closeApp('app-notepad')">−</div>
        <div class="mac-btn mac-max" onclick="maximizeApp('app-notepad')">⤢</div>
      </div>
      <div class="title-text" data-i18n="notepad">Notepad</div>
    </div>
    <div class="window-content">
      <textarea style="width:100%; height:100%; border:none; outline:none; padding:15px; font-family:'Consolas', monospace; font-size:14px; box-sizing:border-box;" placeholder="Type your notes here..."></textarea>
    </div>
  </div>

  <!-- 視窗: 相簿 (Photos) -->
  <div class="window" id="app-photos">
    <div class="title-bar" onmousedown="dragStart(event, 'app-photos')">
      <div class="mac-controls">
        <div class="mac-btn mac-close" onclick="closeApp('app-photos')">✕</div>
        <div class="mac-btn mac-min" onclick="closeApp('app-photos')">−</div>
        <div class="mac-btn mac-max" onclick="maximizeApp('app-photos')">⤢</div>
      </div>
      <div class="title-text" data-i18n="photos">Photos</div>
    </div>
    <div class="window-content photo-grid">
      <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=500" alt="Pic1">
      <img src="https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?w=500" alt="Pic2">
      <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?w=500" alt="Pic3">
      <img src="https://images.unsplash.com/photo-1518173946687-a4c8892bbd9f?w=500" alt="Pic4">
      <img src="https://images.unsplash.com/photo-1426604966848-d7adac402bff?w=500" alt="Pic5">
      <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=500" alt="Pic6">
    </div>
  </div>

  <!-- 工作列 -->
  <div id="taskbar">
    <div class="start-btn" onclick="toggleStart()">
      <img src="https://cdn-icons-png.flaticon.com/512/732/732221.png" alt="Start">
    </div>
    <div class="search-bar">
      <span data-i18n="search">Search the web and Windows</span>
    </div>
    <div class="taskbar-apps" id="taskbar-apps">
      <!-- 工作列圖示 -->
    </div>
    <div class="system-tray">
      <span style="margin-right: 15px;">🌐 🔊 🔋</span>
      <div class="time-date">
        <div id="tb-time">00:00</div>
        <div id="tb-date">0000/00/00</div>
      </div>
    </div>
  </div>
</div>

<script>
// --- 系統應用程式資料庫 ---
const apps = [
  { id: 'app-browser', nameEn: 'Browser', nameZh: '瀏覽器', icon: 'https://cdn-icons-png.flaticon.com/512/3178/3178162.png' },
  { id: 'app-photos', nameEn: 'Photos', nameZh: '相簿', icon: 'https://cdn-icons-png.flaticon.com/512/3342/3342137.png' },
  { id: 'app-notepad', nameEn: 'Notepad', nameZh: '記事本', icon: 'https://cdn-icons-png.flaticon.com/512/3224/3224410.png' },
  { id: 'app-settings', nameEn: 'Settings', nameZh: '系統設定', icon: 'https://cdn-icons-png.flaticon.com/512/3132/3132084.png' }
];

// --- 語言包 (i18n) ---
const dict = {
  en: {
    local_account: "Local Account", search: "Search the web and OS...",
    browser: "Browser", photos: "Photos", notepad: "Notepad", settings: "Settings",
    settings_title: "System Settings", language: "Language", system_info: "System Information"
  },
  zh: {
    local_account: "本機帳戶", search: "在此輸入以搜尋...",
    browser: "瀏覽器", photos: "相簿", notepad: "記事本", settings: "系統設定",
    settings_title: "系統設定", language: "介面語言 (Language)", system_info: "系統資訊"
  }
};
let currentLang = 'en';

function setLanguage(lang) {
  currentLang = lang;
  // 翻譯帶有 data-i18n 標籤的元素
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if(dict[lang][key]) { el.innerText = dict[lang][key]; }
  });
  renderIcons();
}

function renderIcons() {
  const desktopContainer = document.getElementById('desktop-icons');
  const startContainer = document.getElementById('start-grid');
  const taskbarContainer = document.getElementById('taskbar-apps');
  
  desktopContainer.innerHTML = ''; startContainer.innerHTML = ''; taskbarContainer.innerHTML = '';
  
  apps.forEach(app => {
    const name = currentLang === 'en' ? app.nameEn : app.nameZh;
    
    // 桌面 Icon
    desktopContainer.innerHTML += `
      <div class="icon" ondblclick="openApp('${app.id}')">
        <img src="${app.icon}" alt="${name}">
        <span>${name}</span>
      </div>`;
      
    // 開始功能表 Icon
    startContainer.innerHTML += `
      <div class="start-item" onclick="openApp('${app.id}')">
        <img src="${app.icon}" alt="${name}">
        <span style="font-size:12px;">${name}</span>
      </div>`;
      
    // 工作列 Icon
    taskbarContainer.innerHTML += `
      <div class="taskbar-icon" id="tb-${app.id}" onclick="openApp('${app.id}')" title="${name}">
        <img src="${app.icon}" alt="${name}">
      </div>`;
  });
}

// --- 視窗管理邏輯 ---
let zIndex = 100;

function openApp(id) {
  const win = document.getElementById(id);
  win.style.display = 'flex';
  document.getElementById('start-menu').style.display = 'none';
  bringToFront(id);
  
  // 更新工作列狀態
  document.querySelectorAll('.taskbar-icon').forEach(i => i.classList.remove('active'));
  document.getElementById('tb-' + id).classList.add('active');
}

function closeApp(id) {
  document.getElementById(id).style.display = 'none';
  document.getElementById('tb-' + id).classList.remove('active');
}

function maximizeApp(id) {
  const win = document.getElementById(id);
  if (win.style.width === '100%') {
    win.style.width = '700px';
    win.style.height = '450px';
    win.style.top = '10%';
    win.style.left = '15%';
    win.style.borderRadius = '12px';
  } else {
    win.style.width = '100%';
    win.style.height = 'calc(100% - 45px)';
    win.style.top = '0';
    win.style.left = '0';
    win.style.borderRadius = '0';
  }
}

function bringToFront(id) {
  zIndex++;
  document.getElementById(id).style.zIndex = zIndex;
}

// --- 瀏覽器導航邏輯 ---
function navigateBrowser() {
  let url = document.getElementById('url-input').value;
  if(!url.startsWith('http')) url = 'https://' + url;
  // DuckDuckGo 支援 iframe 搜尋：
  if(url.includes('google.com')) url = 'https://duckduckgo.com'; // 防禦 Google iframe 阻擋
  document.getElementById('browser-frame').src = url;
}

// --- 開始功能表 ---
function toggleStart() {
  const menu = document.getElementById('start-menu');
  menu.style.display = (menu.style.display === 'none' || menu.style.display === '') ? 'flex' : 'none';
}
document.getElementById('desktop').addEventListener('click', (e) => {
  if (e.target.id === 'desktop') document.getElementById('start-menu').style.display = 'none';
});

// --- 視窗拖曳邏輯 ---
let isDragging = false, currentWin = null, offsetX, offsetY;
function dragStart(e, id) {
  if(e.target.classList.contains('mac-btn')) return; // 點擊按鈕時不觸發拖曳
  isDragging = true; currentWin = document.getElementById(id); bringToFront(id);
  const rect = currentWin.getBoundingClientRect();
  offsetX = e.clientX - rect.left; offsetY = e.clientY - rect.top;
  document.addEventListener('mousemove', drag); document.addEventListener('mouseup', dragEnd);
}
function drag(e) {
  if (isDragging && currentWin) {
    if(currentWin.style.width === '100%') return; // 最大化時不可拖曳
    currentWin.style.left = (e.clientX - offsetX) + 'px';
    currentWin.style.top = (e.clientY - offsetY) + 'px';
  }
}
function dragEnd() {
  isDragging = false; currentWin = null;
  document.removeEventListener('mousemove', drag); document.removeEventListener('mouseup', dragEnd);
}

// --- 時鐘邏輯 ---
function updateTime() {
  const now = new Date();
  document.getElementById('tb-time').innerText = now.toLocaleTimeString(currentLang === 'en' ? 'en-US' : 'zh-HK', { hour: '2-digit', minute: '2-digit', hour12: false });
  document.getElementById('tb-date').innerText = now.toLocaleDateString(currentLang === 'en' ? 'en-US' : 'zh-HK', { year: 'numeric', month: '2-digit', day: '2-digit' });
}

// --- 系統初始化 ---
window.onload = () => {
  setLanguage('en'); // 預設英文
  updateTime();
  setInterval(updateTime, 1000);
};
</script>
</body>
</html>
